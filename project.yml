name: Rumo
options:
  bundleIdPrefix: com.rumo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configFiles:
  Debug: Rumo/Configuration/Debug.xcconfig
  Release: Rumo/Configuration/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  # iOS App
  Rumo:
    type: application
    platform: iOS
    sources:
      - path: Rumo
        excludes:
          - "**/*macOS*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumo.app
        INFOPLIST_FILE: Rumo/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Rumo/Resources/Rumo.entitlements
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: Rumo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Supabase
      - package: Sentry
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed"
          fi
        basedOnDependencyAnalysis: false

  # macOS App
  Rumo-macOS:
    type: application
    platform: macOS
    sources:
      - path: Rumo
        excludes:
          - "**/AppDelegate.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumo.app.macos
        INFOPLIST_FILE: Rumo/Resources/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Rumo/Resources/Rumo-macOS.entitlements
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: Rumo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
    dependencies:
      - package: Supabase
      - package: Sentry

  # iOS Tests
  RumoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RumoTests
    dependencies:
      - target: Rumo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumo.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Rumo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Rumo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # macOS Tests
  RumoTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RumoTests
    dependencies:
      - target: Rumo-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumo.app.macos.tests

  # iOS UI Tests
  RumoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RumoUITests
    dependencies:
      - target: Rumo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumo.app.uitests

schemes:
  Rumo:
    build:
      targets:
        Rumo: all
        RumoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RumoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Rumo-macOS:
    build:
      targets:
        Rumo-macOS: all
        RumoTests-macOS: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RumoTests-macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
